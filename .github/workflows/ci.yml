name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --all-features

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (aes-128-gcm)
        run: cargo test --package obfuse --no-default-features --features aes-128-gcm

      - name: Test (chacha20-poly1305)
        run: cargo test --package obfuse --no-default-features --features chacha20-poly1305

      - name: Test (xor)
        run: cargo test --package obfuse --no-default-features --features xor

      - name: Test (polymorphic)
        run: cargo test --package obfuse --features polymorphic

      - name: Test (control-flow-flatten)
        run: cargo test --package obfuse --features control-flow-flatten

      - name: Verify polymorphic binary (Linux only)
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          # Install objdump (should already be available on Ubuntu)
          cargo test --features polymorphic --test binary_verification -- --nocapture

  mba-obfuscation:
    name: Verify MBA Obfuscation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install binutils (objdump)
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Verify MBA obfuscation is not optimized away
        run: ./scripts/verify_mba_obfuscation.sh

  cff-obfuscation:
    name: Verify CFF Obfuscation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install binutils (objdump)
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Verify CFF obfuscation is not optimized away
        run: ./scripts/verify_cff_obfuscation.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
